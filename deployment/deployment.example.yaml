apiVersion: apps/v1
kind: Deployment
metadata:
  name: kss-website
  labels:
    app: kss-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kss-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kss-website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          # Replace with the published image before applying.
          image: registry.example.com/kss-website:0.1.0
          ports:
            - name: web
              containerPort: 8000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kss-website
spec:
  type: ClusterIP
  selector:
    app: kss-website
  ports:
    - name: web
      port: 80
      targetPort: web
